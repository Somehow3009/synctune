# Render Blueprint - triển khai backend SyncTune (FastAPI + yt-dlp)
# Cách dùng: đẩy repo lên GitHub, vào Render -> New -> Blueprint -> chọn repo này.
services:
  - type: web
    name: synctune-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: >-
      pip install -r requirements.txt &&
      pip install -U yt-dlp &&
      curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip &&
      python -c "import zipfile; zipfile.ZipFile('/tmp/deno.zip').extractall('bin')" &&
      chmod +x bin/deno &&
      bin/deno --version
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        sync: false
      - key: CACHE_TTL
        value: "1800"
      - key: YTDLP_COOKIES_FROM_BROWSER
        sync: false
      - key: YTDLP_COOKIEFILE
        sync: false
      - key: YTDLP_JS_RUNTIME
        value: bin/deno
      - key: YTDLP_REMOTE_COMPONENTS
        sync: false
      - key: DEBUG_TOKEN
        sync: false
